# The only way production is deployed (docs/decisions.md). Runs on every push to main and by hand.
# Actions are pinned to commit SHAs; wrangler comes from the repo's own dependencies.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reverify_run:
        description: "The reverify run whose failing list to use (reverify passes it; empty: the newest one with a list)"
        required: false
        default: ""

permissions:
  contents: read

# One deploy at a time; a deploy that has started is never cancelled.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      # Reads the newest reverify run's failing list (an artifact), so failing lessons are withheld from the index.
      actions: read
    steps:
      - name: Note when this job started
        run: echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # verified_at and pr come from git history
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      # Only reverify's own runs on main (scheduled or by hand) are trusted, never a pull request's: a PR can edit the
      # workflow and upload any artifact. A run reverify passes in must be one of those and must have its list (fail
      # closed); otherwise the newest trusted run with a list is used, and with none, nothing is withheld.
      - name: Get the lessons failing reverify
        env:
          GH_TOKEN: ${{ github.token }}
          REVERIFY_RUN: ${{ inputs.reverify_run }}
        run: |
          trusted() {
            gh run view "$1" --repo "$GITHUB_REPOSITORY" --json event,headBranch,path \
              --jq '(.event == "schedule" or .event == "workflow_dispatch") and .headBranch == "main" and .path == ".github/workflows/reverify.yml"'
          }
          if [ -n "$REVERIFY_RUN" ]; then
            case "$REVERIFY_RUN" in *[!0-9]*) echo "reverify_run must be a run id."; exit 1 ;; esac
            [ "$(trusted "$REVERIFY_RUN")" = "true" ] || { echo "Run $REVERIFY_RUN is not a reverify run on main."; exit 1; }
            gh run download "$REVERIFY_RUN" --repo "$GITHUB_REPOSITORY" --name reverify-failing --dir .reverify
            exit 0
          fi
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow reverify.yml --branch main --status completed --limit 10 \
              --json databaseId,event --jq '.[] | select(.event == "schedule" or .event == "workflow_dispatch") | .databaseId'); do
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name reverify-failing --dir .reverify; then
              echo "Using the failing list from reverify run $run."
              exit 0
            fi
          done
          echo "::warning::No reverify failing list found; nothing is withheld."
      # Build before testing: the Worker tests serve the built site through ASSETS.
      - name: Build
        run: npm run build
        env:
          # Read-only, this job only: looks up teachers' current logins by id (docs/decisions.md).
          GITHUB_READ_TOKEN: ${{ github.token }}
          # Lessons failing the nightly reverify leave the index until fixed or retracted (docs/decisions.md).
          LUDION_WITHHOLD: .reverify/failing.json

      - run: npm test

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check production
        run: node tools/check-production.ts https://ludion.ai
