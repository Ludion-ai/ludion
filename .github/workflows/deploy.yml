# The only way production is deployed (docs/decisions.md). Runs on every push to main and by hand.
# Actions are pinned to commit SHAs; wrangler comes from the repo's own dependencies.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reverify_run:
        description: "The reverify run whose failing list to use (reverify passes it; empty: the newest successful run)"
        required: false
        default: ""

permissions:
  contents: read

# One deploy at a time; a deploy that has started is never cancelled.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      # Reads the newest reverify run's failing list (an artifact), so failing lessons are withheld from the index.
      actions: read
    steps:
      - name: Note when this job started
        run: echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # verified_at and pr come from git history
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      - name: Get the lessons failing reverify
        env:
          GH_TOKEN: ${{ github.token }}
          REVERIFY_RUN: ${{ inputs.reverify_run }}
        run: |
          run="$REVERIFY_RUN"
          case "$run" in *[!0-9]*) echo "reverify_run must be a run id."; exit 1 ;; esac
          [ -n "$run" ] || run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow reverify.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run" ]; then
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name reverify-failing --dir .reverify || echo "No failing list in run $run."
          fi

      # Build before testing: the Worker tests serve the built site through ASSETS.
      - name: Build
        run: npm run build
        env:
          # Read-only, this job only: looks up teachers' current logins by id (docs/decisions.md).
          GITHUB_READ_TOKEN: ${{ github.token }}
          # Lessons failing the nightly reverify leave the index until fixed or retracted (docs/decisions.md).
          LUDION_WITHHOLD: .reverify/failing.json

      - run: npm test

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check production
        run: node tools/check-production.ts https://ludion.ai
