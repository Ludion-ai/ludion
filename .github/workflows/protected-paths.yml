# Required check "protected-paths".
# Fails a PR that touches a protected path until an independent review has approved the PR's CURRENT head:
# the PR must carry the "review-approved" label AND the latest comment with a line "reviewed-sha: <head sha>" must
# approve. Every review has exactly one such line, whatever its verdict, but not always as its last line (a footer may
# follow it), so every line of a comment is read. The comment's first line, the verdict, decides (REVIEWS below), and
# a later review of the same head that does not approve undoes an earlier approval.
# A push changes the head SHA, so any earlier approval stops counting by itself; nothing has to be removed.
#
# Runs on pull_request_target so the workflow definition always comes from the base branch; a PR cannot
# edit this file to pass itself. It never checks out or runs PR code: it only reads the API.
# All agents push from the same GitHub account, so this is a process gate, not a technical one:
# see docs/protected-paths.md for who may approve and how.
name: protected-paths

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

concurrency:
  group: protected-paths-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  protected-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check protected paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABEL: review-approved
          # A file deleted here, or renamed to a path outside all of these places, makes the PR protected: removing what
          # Ludion does is a scope change, and decision and mistake records are never deleted (CLAUDE.md, How we work).
          REMOVED: '^packages/[^/]+/src/|^apps/site/src/pages/|^action/|^action\.yml$|^docs/decisions/|^docs/mistakes/'
          # Applied to each page of the PR's comments, oldest first: "<approve|other> <sha>" for every line that is, in
          # full, "reviewed-sha: <40 lowercase hex>". A review's first line states its verdict; it approves when that
          # line has the word APPROVE and not REQUEST, and the comment has exactly one such line. A comment with two or
          # more (one quoting another review, say) approves nothing and undoes an earlier approval of each head it
          # names (docs/protected-paths.md). CRLF line ends are read as LF, so a review written with them still counts.
          REVIEWS: |
            .[] | (.body | gsub("\r\n"; "\n") | split("\n")) as $lines
            | [$lines[] | capture("^reviewed-sha: (?<sha>[0-9a-f]{40})$").sha] as $shas
            | (if ($shas | length) == 1 and ($lines[0] | test("\\bAPPROVE\\b") and (test("REQUEST") | not)) then "approve" else "other" end) as $verdict
            | $shas[] | "\($verdict) \(.)"
        run: |
          set -euo pipefail
          pattern='(^|/)(CLAUDE|AGENTS)\.md$|(^|/)\.cursorrules$|(^|/)CODEOWNERS$|^\.claude/|^\.cursor/|^\.github/|^tools/verify/|^packages/sandbox/|^lessons/|^packages/[^/]+/src/schema\.ts$|^packages/[^/]+/schema/|\.schema\.json$|^ludion\.config\.json$|^wrangler\.jsonc$|^docs/protected-paths\.md$'

          # Read the head SHA live, not from the event payload, so a stale run cannot approve a newer head.
          head=$(gh api "repos/${REPO}/pulls/${PR}" --jq '.head.sha')

          files=$(gh api --paginate "repos/${REPO}/pulls/${PR}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          deleted=$(gh api --paginate "repos/${REPO}/pulls/${PR}/files" \
            --jq '.[] | select(.status == "removed" or (.status == "renamed" and (.filename | test(env.REMOVED) | not)))
              | (.previous_filename // .filename) | select(test(env.REMOVED))')
          hits=$( { printf '%s\n' "$files" | grep -E "$pattern" || true; printf '%s\n' "$deleted" | sed '/^$/d; s/$/ (deleted)/'; } | sort -u)

          if [ -z "$hits" ]; then
            echo "No protected paths changed."
            exit 0
          fi

          token="stop-$(date +%s%N)"
          echo "::stop-commands::${token}"
          echo "Protected paths changed:"
          printf '%s\n' "$hits" | sed 's/^/  /'
          echo "::${token}::"

          has_label=$(gh api "repos/${REPO}/issues/${PR}/labels" --jq "[.[] | select(.name == \"${LABEL}\")] | length")
          if [ "$has_label" = "0" ]; then
            echo "::error::This PR changes protected paths. It needs an independent review and the \"${LABEL}\" label (docs/protected-paths.md)."
            exit 1
          fi

          # The latest review of the current head decides.
          verdict=$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" --jq "$REVIEWS" \
            | awk -v head="$head" '$2 == head { verdict = $1 } END { print verdict }')
          if [ "$verdict" != "approve" ]; then
            echo "::error::The latest review that says \"reviewed-sha: ${head}\" does not approve, or there is none. The review must cover the current head and approve it; review again after every push."
            exit 1
          fi

          echo "Approved for head ${head}."
