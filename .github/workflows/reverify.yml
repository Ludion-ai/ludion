# Nightly reverify (docs/decisions.md, "Nightly reverify"). Two jobs, so lesson code never runs next to a write token:
# `check` runs the evidence of every active lesson on main (tests in Docker, network off; sources through the guarded
# fetch) with a read-only token; `report` reads its results only, starts a deploy when the set of failing lessons
# changed (so they leave the index at once), and prepares a retraction branch and an issue per failing lesson.
name: reverify

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reverify
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # A failing lesson makes verify exit 1; the results still go to report, which decides what counts.
      - name: Check every active lesson's evidence
        run: npm run verify -- lessons/ --run --evidence-only --json results.json || echo "Some lessons failed."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reverify-results
          path: results.json
          retention-days: 14

  # Reads results.json and runs only main's own report script; never runs lesson code.
  report:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # pushes retract/<id> branches
      issues: write
      actions: write # starts deploy.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reverify-results
          path: tonight

      # Only this workflow's own runs on main count (scheduled or started by hand), never a pull request's.
      # Last night's results: the newest completed one at least 12 hours older, so a manual run soon after the nightly
      # one doesn't count as "last night". The list production uses: the newest one with a list, whatever its age.
      - name: Get last night's results and the current list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow reverify.yml --branch main --limit 30 \
            --json databaseId,event,createdAt,status \
            --jq "[.[] | select((.event == \"schedule\" or .event == \"workflow_dispatch\") and .databaseId != $GITHUB_RUN_ID)]")
          prev=$(echo "$runs" | jq -r --arg cutoff "$cutoff" '[.[] | select(.status == "completed" and .createdAt < $cutoff)][0].databaseId // empty')
          if [ -n "$prev" ]; then
            gh run download "$prev" --repo "$GITHUB_REPOSITORY" --name reverify-results --dir last-night || echo "No results from run $prev."
          fi
          for run in $(echo "$runs" | jq -r '.[].databaseId'); do
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name reverify-failing --dir last-failing; then
              echo "The current list comes from run $run."
              break
            fi
          done

      - name: Decide what fails tonight
        run: node tools/verify/src/reverify-cli.ts count tonight/results.json last-night/results.json --out failing.json --last-failing last-failing/failing.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reverify-failing
          path: failing.json
          retention-days: 30

      # Deploys when the list changed, and every night while it isn't empty, so a deploy that failed is retried.
      - name: Deploy if lessons are withheld or the list changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(jq -c '[.failing[].id] | sort' failing.json)
          before=$( [ -f last-failing/failing.json ] && jq -c '[.failing[].id] | sort' last-failing/failing.json || echo '[]')
          if [ "$now" != "$before" ] || [ "$now" != "[]" ]; then
            echo "Failing lessons: $before -> $now; deploying so the index follows."
            gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f reverify_run="$GITHUB_RUN_ID"
          else
            echo "No lessons withheld, and no change."
          fi

      # Last, so a failure here never stops the list from being uploaded or the deploy from starting. Fails the run
      # when tonight was suspended (too many failures at once) or a lesson couldn't be reported.
      - name: Prepare retraction branches and issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/verify/src/reverify-cli.ts report failing.json
