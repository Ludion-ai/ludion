# Nightly reverify (docs/decisions.md, "Nightly reverify"). Two jobs, so lesson code never runs next to a write token:
# `check` runs every lesson on main as verify does (tests in Docker, network off; sources through the guarded fetch)
# with a read-only token; `report` reads its results only, opens a retraction PR per confirmed failure, and starts a
# deploy when the set of failing lessons changed, so failing lessons leave the index at once.
name: reverify

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reverify
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # A failing lesson makes verify exit 1; the results still go to report.
      - name: Verify every lesson
        run: npm run verify -- lessons/ --run --json results.json || echo "Some lessons failed; report decides what counts."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reverify-results
          path: results.json
          retention-days: 14

  # Reads results.json and runs only main's own report script; never runs lesson code.
  report:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reverify-results
          path: tonight

      - name: Get last night's results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow reverify.yml --status success --limit 5 --json databaseId \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)][0].databaseId // empty")
          if [ -n "$prev" ]; then
            gh run download "$prev" --repo "$GITHUB_REPOSITORY" --name reverify-results --dir last-night || echo "No results from run $prev."
            gh run download "$prev" --repo "$GITHUB_REPOSITORY" --name reverify-failing --dir last-failing || echo "No failing list from run $prev."
          fi

      - name: Count failures and open retraction PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/verify/src/reverify-cli.ts tonight/results.json last-night/results.json --out failing.json --open-prs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reverify-failing
          path: failing.json
          retention-days: 30

      - name: Deploy if the failing lessons changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(jq -c '[.failing[].id] | sort' failing.json)
          before=$( [ -f last-failing/failing.json ] && jq -c '[.failing[].id] | sort' last-failing/failing.json || echo '[]')
          if [ "$now" != "$before" ]; then
            echo "Failing lessons changed ($before -> $now); deploying so the index follows."
            gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f reverify_run="$GITHUB_RUN_ID"
          else
            echo "No change in failing lessons."
          fi
