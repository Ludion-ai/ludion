# Nightly seed watch (docs/decisions.md, "The seed pipeline"). Finds new stable releases of the packages Ludion covers,
# drafts lessons for them with the seed pipeline, and prepares a branch and an issue for a person to open the PR
# (GitHub Actions can't open pull requests in this repository). Three jobs, so nothing reads untrusted text next to a
# write token, and lesson code never runs here at all: CI's verify runs it on the PR.
name: seed-watch

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "Look for releases published at or after this time (ISO). Default: the last 26 hours."
        required: false

permissions:
  contents: read

concurrency:
  group: seed-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read # to skip releases an earlier seed issue already names
    outputs:
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Find new releases of covered packages
        id: find
        env:
          SINCE: ${{ inputs.since }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/seed/src/watch.ts ${SINCE:+--since "$SINCE"} --json releases.json
          # The window overlaps the night before, so drop releases an earlier seed issue already names ("Release: pkg@version").
          gh issue list --repo "$GITHUB_REPOSITORY" --label seed-release --state all --limit 300 --json body --jq '.[].body' | tr -d '\r' > seen.txt || : > seen.txt
          jq -c '.[]' releases.json | while read -r r; do
            key=$(jq -r '"\(.package)@\(.version)"' <<<"$r")
            grep -qxF "Release: $key" seen.txt || echo "$r"
          done | jq -s '.' > fresh.json
          mv fresh.json releases.json
          echo "count=$(jq length releases.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seed-releases
          path: releases.json
          retention-days: 14

  # Reads release notes, pull requests, and package code (untrusted text) with a read-only token. The drafting agents
  # get no shell and run no code. Needs the ANTHROPIC_API_KEY secret; without it, this job says so and stops.
  draft:
    needs: watch
    if: needs.watch.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seed-releases

      - name: Draft, check, and review lessons for each release
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          LUDION_SEED_CACHE: ${{ runner.temp }}/seedwork
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::No ANTHROPIC_API_KEY secret: new releases are listed in the artifact, but nothing is drafted."
            exit 0
          fi
          npm install -g @anthropic-ai/claude-code@2.1.296
          mkdir -p out/lessons out/runs
          jq -c '.[]' releases.json | while read -r r; do
            pkg=$(echo "$r" | jq -r .package); ver=$(echo "$r" | jq -r .version)
            dir="out/runs/$(echo "$pkg" | sed 's#^@##; s#/#.#')-$ver"
            # One release that fails (registry, gh, a step) must not lose the others: it is skipped with a warning.
            # (set -e would be ignored on the left of ||, so the steps are chained with &&.)
            { node tools/seed/src/cli.ts collect "$dir" --package "$pkg" --range "$ver" \
              && node tools/seed/src/cli.ts triage "$dir" \
              && node tools/seed/src/cli.ts draft "$dir" --kinds default,behavior,deprecated,renamed,removed --limit 10 \
              && node tools/seed/src/cli.ts check "$dir" \
              && node tools/seed/src/cli.ts review "$dir" \
              && node tools/seed/src/cli.ts lessons "$dir" --out out/lessons \
              && node tools/seed/src/cli.ts summary "$dir" > /dev/null; } \
              || echo "::warning::Drafting failed for $pkg $ver; skipped."
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: seed-drafts
          # Only what publish reads: the lessons that passed, and each run's release (no raw agent drafts, which are unreviewed).
          path: |
            out/lessons
            out/runs/*/run.json
          if-no-files-found: ignore
          retention-days: 14

  # Reads the drafted lesson files only (JSON, checked against main's schema before anything else), pushes them to a
  # branch, and opens an issue linking the compare page. Never runs lesson code or the drafting tools.
  publish:
    needs: draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # pushes seed/<package>-<versions> branches
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false # the write token is used only for the push and the issue, not left on disk next to npm ci

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: seed-drafts
          path: drafts

      - name: Push a branch and open an issue per subject
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d drafts/lessons ] || [ -z "$(ls -A drafts/lessons)" ]; then
            echo "No lessons drafted tonight."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for subject_dir in drafts/lessons/*/; do
            subject=$(basename "$subject_dir")
            # Subject and file names are checked before they reach a path or a branch name.
            echo "$subject" | grep -Eq '^[a-z0-9][a-z0-9.-]{0,63}$' || { echo "Bad subject $subject"; continue; }
            branch="seed/$subject-$(date -u +%Y%m%d)-$GITHUB_RUN_ID"
            git checkout -q -B "$branch" origin/main
            mkdir -p "lessons/$subject"
            for f in "$subject_dir"*.json; do
              name=$(basename "$f")
              echo "$name" | grep -Eq '^[0-9A-HJKMNP-TV-Z]{26}\.json$' || { echo "Bad file $name"; continue; }
              [ -e "lessons/$subject/$name" ] && continue
              # The drafting job's artifact is not trusted: only what the pipeline itself writes goes in.
              jq -e --arg s "$subject" '.format == 1 and .subject == $s and .drafted_by == "agent" and .author == "github:Ludion-ai" and .author_id == 292738933 and (has("replaces") | not)' "$f" > /dev/null \
                || { echo "Unexpected fields in $name; left out."; continue; }
              cp "$f" "lessons/$subject/$name"
            done
            # Schema, canonical form, path, and sources against main's checker; no --run, so no lesson code runs.
            if ! env -u GH_TOKEN npm run verify -- "lessons/$subject" > "verify-$subject.txt" 2>&1; then
              echo "Drafted lessons for $subject didn't pass the checks; not pushed."
              cat "verify-$subject.txt"
              continue
            fi
            git add "lessons/$subject"
            git diff --cached --quiet && continue
            n=$(git diff --cached --name-only | wc -l)
            git commit -q -m "Teach $n new $subject lessons (drafted by an agent)"
            git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch" || { echo "Push of $branch failed; $subject skipped."; continue; }
            # "Release: pkg@version" lines are how the next night's watch knows these releases are already drafted.
            releases=""
            for r in drafts/runs/*/run.json; do
              [ -e "$r" ] || continue
              sub=$(jq -r '.package' "$r" | sed 's#^@##; s#/#.#' | tr 'A-Z' 'a-z')
              [ "$sub" = "$subject" ] && releases="$releases$(jq -r '"Release: \(.package)@\(.range)"' "$r")"$'\n'
            done
            body=$(printf '%s\n\n%s\n\n%s\n\n%s' \
              "The seed watch drafted $n lessons for new $subject releases (drafted by an agent; each is signed by the account that opens the PR, so open it from @Ludion-ai)." \
              "Open the pull request: https://github.com/$GITHUB_REPOSITORY/compare/main...$branch?expand=1" \
              "CI's verify runs their tests in Docker on the PR. Run a fresh-context review before merging (CLAUDE.md). Drafting run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              "$releases")
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Seed lessons for $subject ($(date -u +%Y-%m-%d))" --label seed-release --body "$body" || echo "Issue for $subject failed; the branch $branch is pushed."
          done
