# Required check "test". Runs on every PR.
name: test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # PRs target main, and a lane starts from main, never from an open PR (CLAUDE.md, How we work).
      - name: The PR targets main
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$BASE" != "main" ]; then
            echo "::error::This PR does not target main. Retarget it to main; stacked PRs are not used (CLAUDE.md, How we work)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # Chromium for the e2e checks below.
      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: npx playwright install-deps chromium
      # Build first: the Worker tests run in workerd and serve apps/site/dist through ASSETS.
      - run: npm run build
      - run: npm test
      # Playwright + axe on every page, light and dark, against the built site under wrangler dev.
      - run: npm run test:e2e
