# Ludion as a GitHub Action (README.md, "Getting started"). Preview, not released: nothing is merged, and the
# judgement is not a required check.
#
# The judge for npm dependency PRs: two modes, for two jobs in two workflows, split like this repository's judge.yml
# and judge-comment.yml:
#   mode: judge    on pull_request, with `contents: read` only. Reads the PR's package.json and package-lock.json, and
#                  each changed */package.json, as data through the API, runs the judge bundled in this action, and
#                  uploads the record as an artifact.
#                  Nothing from the PR is checked out, installed or run.
#   mode: comment  on workflow_run after the judge workflow, with `pull-requests: write`. Finds the PR from GitHub,
#                  refuses a head that changes .github/ before reading the artifact, checks the artifact as untrusted
#                  data and posts it as one comment per PR, updated by each new judgement. It runs nothing from the
#                  PR or the artifact.
#
# Ludion's own fixes, one PR per fix: two modes, for two jobs of one scheduled workflow (action/patch-workflow.yml;
# docs/bench/2026-10-30-lb-design):
#   mode: patch         on schedule or workflow_dispatch, with `contents: read` only and no token. Checks out the run's
#                       commit without credentials, runs `ludion patch --apply` (candidates are built and tested only
#                       in Docker) and uploads the receipt and a bundle of the fix branches as the ludion-fixes artifact.
#   mode: pull-request  after mode patch, with `contents: write` and `pull-requests: write`. Runs no dependency code:
#                       checks the artifact as untrusted data (each branch one commit on the run's commit, changing only
#                       the files the plan may change), then pushes each fix to its own branch, never forced, and opens
#                       one PR per fix unless a PR from that branch exists.
#
# Pin this action by a release commit's full SHA. Only a release commit carries the bundled judge
# (packages/cli/dist/cli.js and action/dist/record.js, built by action/build.ts); any other commit stops with an error.
name: Ludion (preview)
description: "Preview, nothing is merged. Judges npm dependency PRs (parts of gates 1, 2 and 4 and the wait; no gate 3), and opens one PR per validated security fix."
author: Ludion
branding:
  icon: shield
  color: gray-dark

inputs:
  mode:
    description: "judge (the read-only job, on pull_request), comment (the job that posts, on workflow_run), patch (the read-only job that validates fixes, on schedule) or pull-request (the job that opens their PRs, after patch)."
    required: true
  judge-workflow:
    description: "mode comment: the path of the workflow that runs mode judge. Only that workflow's runs are posted."
    required: false
    default: .github/workflows/ludion-judge.yml
  dir:
    description: "modes patch and pull-request: the project's folder in the repository, with its ludion.security.json."
    required: false
    default: "."

outputs:
  packed:
    description: "mode patch: true when the ludion-fixes artifact holds at least one applied fix."
    value: ${{ steps.patch.outputs.packed }}

runs:
  using: composite
  steps:
    - name: Check the mode, the event and the tools
      id: start
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        EVENT: ${{ github.event_name }}
        RECORD: ${{ runner.temp }}/ludion/judgement.json
        PR: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        MERGE_SHA: ${{ github.sha }}
        REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: bash "$GITHUB_ACTION_PATH/action/start.sh"

    # modes judge, patch and pull-request

    - name: Check that this commit of the action carries the bundled judge
      id: bundle
      if: ${{ inputs.mode != 'comment' }}
      shell: bash
      run: |
        for file in packages/cli/dist/cli.js action/dist/record.js; do
          if [ ! -f "$GITHUB_ACTION_PATH/$file" ]; then
            echo "::error::This commit of the action has no bundled judge (${file}). Pin a release commit's SHA."
            exit 1
          fi
        done

    # mode judge

    # The base is the test merge commit's first parent: the event's base SHA is set when the PR opens and is not
    # updated when the base branch moves. That commit must be on the base branch.
    - name: Read the PR's package.json files and package-lock.json as data
      id: read
      if: ${{ inputs.mode == 'judge' && steps.bundle.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        INPUT: ${{ runner.temp }}/ludion/input
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        MERGE_SHA: ${{ github.sha }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: bash "$GITHUB_ACTION_PATH/action/read.sh"

    # Also after a failed read, so the record says which step failed; not after a cancel.
    - name: Judge
      if: ${{ inputs.mode == 'judge' && !cancelled() && steps.bundle.outcome == 'success' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        RECORD: ${{ runner.temp }}/ludion/judgement.json
        INPUT: ${{ runner.temp }}/ludion/input
        STARTED_AT: ${{ steps.start.outputs.at }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BASE_SHA: ${{ steps.read.outputs.base || github.event.pull_request.base.sha }}
        MERGE_SHA: ${{ github.sha }}
        BUILD_OUTCOME: success
        READ_OUTCOME: ${{ steps.read.outcome }}
      run: node action/dist/record.js

    - name: Summary
      if: ${{ inputs.mode == 'judge' && always() && steps.start.outcome == 'success' }}
      shell: bash
      env:
        RECORD: ${{ runner.temp }}/ludion/judgement.json
      run: |
        {
          echo "**プレビュー：コメントのみ。マージは行わない。** Preview: comments only; nothing is merged."
          echo
          jq -r '"Verdict: `\(.verdict)` · head `\(.head_sha)` · judge \(.judge_seconds // "unknown") s, job \(.job_seconds // "unknown") s"' "$RECORD"
          echo
          echo "Gate 3 (build and tests) is not run, so none of these verdicts means the PR can be applied. The full judgement is in this run's log and its ludion-judgement artifact; the comment job posts it on the PR."
        } >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ inputs.mode == 'judge' && always() && steps.start.outcome == 'success' }}
      with:
        name: ludion-judgement
        path: ${{ runner.temp }}/ludion/judgement.json
        if-no-files-found: error
        # A re-run of the job replaces the record instead of failing on the name.
        overwrite: true
        retention-days: 90

    # mode comment

    - name: Check the judgement and post it
      if: ${{ inputs.mode == 'comment' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        JUDGE_WORKFLOW: ${{ inputs.judge-workflow }}
        RUN_EVENT: ${{ github.event.workflow_run.event }}
        RUN_PATH: ${{ github.event.workflow_run.path }}
        RUN_ID: ${{ github.event.workflow_run.id }}
        RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
        RUN_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        RUN_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
        RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        RUN_URL: ${{ github.event.workflow_run.html_url }}
        CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      run: bash "$GITHUB_ACTION_PATH/action/comment.sh"

    # modes patch and pull-request

    # The run's own commit, with no credential left in .git/config. The fixes are commits on it.
    - name: Check out the run's commit
      if: ${{ inputs.mode == 'patch' || inputs.mode == 'pull-request' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 1

    # No token here: only the checkout above used the job's read-only token, to fetch, and left no credential on disk.
    - name: Validate each fix and commit it on its own branch
      id: patch
      if: ${{ inputs.mode == 'patch' && steps.bundle.outcome == 'success' }}
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        CLI: ${{ github.action_path }}/packages/cli/dist/cli.js
        PROJECT: ${{ github.workspace }}/${{ inputs.dir }}
        OUT: ${{ runner.temp }}/ludion/fixes
      run: bash "$GITHUB_ACTION_PATH/action/patch.sh"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ inputs.mode == 'patch' && steps.patch.outputs.packed == 'true' }}
      with:
        name: ludion-fixes
        path: ${{ runner.temp }}/ludion/fixes
        if-no-files-found: error
        retention-days: 7

    - name: Fail the job when a fix failed
      if: ${{ inputs.mode == 'patch' && steps.patch.outcome == 'success' && steps.patch.outputs.status != '0' }}
      shell: bash
      env:
        STATUS: ${{ steps.patch.outputs.status }}
      run: |
        echo "::error::ludion patch exited ${STATUS}: a fix failed or could not be validated (the receipt says which). The fixes that passed go on to the PR job."
        exit 1

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: ${{ inputs.mode == 'pull-request' && steps.bundle.outcome == 'success' }}
      with:
        name: ludion-fixes
        path: ${{ runner.temp }}/ludion/fixes

    # The only step that holds the token. It runs the bundled CLI and Git, nothing from the project or the artifact.
    - name: Check the fixes as untrusted data and open one PR per fix
      if: ${{ inputs.mode == 'pull-request' && steps.bundle.outcome == 'success' }}
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        GH_TOKEN: ${{ github.token }}
        CLI: ${{ github.action_path }}/packages/cli/dist/cli.js
        PROJECT: ${{ github.workspace }}/${{ inputs.dir }}
        ARTIFACT: ${{ runner.temp }}/ludion/fixes
      run: |
        node "$CLI" deliver open --dir "$PROJECT" --artifact "$ARTIFACT" --base "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
          --ref "$GITHUB_REF" --api "$GITHUB_API_URL" --remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" | tee -a "$GITHUB_STEP_SUMMARY"
