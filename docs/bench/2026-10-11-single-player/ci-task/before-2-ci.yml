name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # With no outputFile configured, Vitest writes the JUnit report to .vitest/junit/output.xml
      - run: npx vitest run --reporter=junit

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-report
          path: .vitest/junit/output.xml
          include-hidden-files: true
