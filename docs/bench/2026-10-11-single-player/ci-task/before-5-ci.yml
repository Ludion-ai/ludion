name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx vitest run --reporter=junit

      - name: Upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          # Vitest's default junit location (no outputFile configured)
          path: .vitest/junit/output.xml
          # .vitest is a dot-directory; upload-artifact skips hidden files by default
          include-hidden-files: true
          if-no-files-found: error
