# LB2b2 trial: this repository's own CI, to see which of three forms puts it on a PR that Ludion opens with the
# workflow's token (Ludion-ai/ludion docs/decisions/2026-10-31-lb2b2-trial-definitions.md on lane/lb2b2-trial-ci, item 3).
# Each PHP sample's image is built and its ludion.security.json test runs offline.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build each PHP sample and run its test offline
        run: |
          for dir in php php-a php-b php-c php-d; do
            docker build --tag "trial-${dir}" "$dir"
            docker run --rm --network none "trial-${dir}" php tests/smoke.php
          done

  # Form B2 (definitions, addendum): a dispatched run's checks are not on the PR, so its result goes on the commit as a
  # status. Checks nothing out and runs no project code.
  report:
    needs: test
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post the test job's result as the commit status ci/test
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.test.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api -X POST "repos/$REPO/statuses/$GITHUB_SHA" -f state="$state" -f context=ci/test -f target_url="$RUN_URL" \
            -f description="ci.yml test job: ${RESULT}"
