<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ludion launch film</title>
<link rel="stylesheet" href="stage.css">
</head>
<body>
<div id="stage">
  <canvas id="water"></canvas>
  <div id="cam"></div>
  <div id="flash"></div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Horizontal tearing: bands of noise push each band of pixels sideways. Scale 0 = off. -->
    <filter id="tear" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence id="tear-noise" type="fractalNoise" baseFrequency="0.0001 0.06" numOctaves="1" seed="1" result="n"/>
      <feDisplacementMap id="tear-map" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="A"/>
    </filter>
    <!-- Sideways motion blur for whip moves. -->
    <filter id="whip" x="-20%" y="-5%" width="140%" height="110%">
      <feGaussianBlur id="whip-blur" stdDeviation="0 0"/>
    </filter>
  </defs>
</svg>
<script type="module" src="stage.js"></script>
</body>
</html>
